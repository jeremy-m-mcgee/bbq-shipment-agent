[project]
name = "bbq-shipment-agent"
version = "0.1.0"
description = "Assembles and ships frozen barbecue packets, with a human approving before any label is bought."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "jeremy-m-mcgee", email = "mcgjeremy@gmail.com" }
]
# Capped at <4 for Poetry's resolver, not for uv's. Poetry refuses to solve an
# uncapped range against a dependency that caps itself (launchdarkly-server-sdk-ai
# requires <4), so `poetry install` fails outright without this. uv is
# indifferent either way, and nothing here is expected to see Python 4.
requires-python = ">=3.12,<4"
dependencies = [
    "anthropic>=0.120.2",
    "chevron>=0.14.0",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "launchdarkly-server-sdk>=9.16.1",
    "launchdarkly-server-sdk-ai>=1.2.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "shippo>=3.9.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
bbq-shipment-agent = "bbq_shipment_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
# The code was written to a ~100-char habit, not Black's 88. Match it.
line-length = 100

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E), import sort (I), pyupgrade (UP),
# bugbear (B), flake8-simplify (SIM). Real-bug and modernization value
# without style bikeshedding. Widen deliberately, not all at once.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are call-in-default by design, not the B008 bug.
extend-immutable-calls = [
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Depends",
]
