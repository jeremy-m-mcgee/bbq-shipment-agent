[project]
name = "bbq-shipment-agent"
version = "0.1.0"
description = "Assembles and ships frozen barbecue packets, with a human approving before any label is bought."
readme = "README.md"
authors = [
    { name = "jeremy-m-mcgee", email = "mcgjeremy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "chevron>=0.14.0",
    "duckdb>=1.5.5",
    "launchdarkly-server-sdk>=9.16.1",
    "launchdarkly-server-sdk-ai>=1.2.0",
    "pyyaml>=6.0.3",
    "shippo>=3.9.0",
]

[project.scripts]
bbq-shipment-agent = "bbq_shipment_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
