# Capability configuration. See docs/design.md section 6.7.
#
# `kill_switch` lives here rather than in LaunchDarkly on purpose: stopping the
# pipeline has to be a visible commit, not a console toggle.
#
# `authority` and `authority_ceiling` were here and are gone. Dispatch was
# removed (section 9), so nothing read the resolved value and the ceiling
# clamped a capability no stage consulted. `memory` went with it for the same
# reason -- design 4's pre-flagging behaviour was never built. Every capability
# below is read by a stage.
#
# Values are quoted deliberately. YAML 1.1 parses bare `off` and `on` as
# booleans, and `planner` is not a boolean -- it has three states, and `shadow`
# is how a capability earns promotion. Unquoted, `planner` would be a bool in
# two profiles and a string in the third. The loader re-coerces bools back to
# "off"/"on" so dropping the quotes cannot silently change a type, but keep
# them anyway: the file should read the way it parses.

profiles:
  baseline:
    planner: "off"            # python sequences the stages
    validation: "standard"    # b2 applies validator corrections
    verification: "off"

  planner_trial:
    planner: "shadow"         # runs, output logged not used
    validation: "standard"
    verification: "on"

  full:
    planner: "on"
    validation: "strict"      # correctable addresses go to a human
    verification: "on"

default_profile: "baseline"

kill_switch: false

# Capability dependencies as data rather than hand-written clamping logic
# (section 6.9). A failed prerequisite demotes the capability and records why;
# it never aborts the run. Degrading to a weaker proposal that a human is
# reviewing anyway is the correct failure mode.
prerequisites:
  - id: planner_on_needs_shadow_history
    description: >-
      Promoting the planner to on requires shadow to have been evaluated
      across a minimum number of completed runs.
    when: {planner: "on"}
    requires: {shadow_runs_at_least: 5}
    demote: {planner: "shadow"}
