<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}bbq-shipment-agent{% endblock %}</title>
<style>
:root {
  --bg: #12100e; --panel: #1b1815; --line: #322c26; --ink: #ece6df;
  --dim: #9a8f84; --accent: #e0952f; --good: #6fae5e; --bad: #d4635a;
  --warn: #d8a13c;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f7f4f0; --panel: #fff; --line: #e0d8ce; --ink: #241f1a;
    --dim: #6f665d; --accent: #a8640c; --good: #3f7a2f; --bad: #a83a31;
    --warn: #8a6210;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
code, .mono, table.rows, pre { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
a { color: var(--accent); }
header.top {
  border-bottom: 1px solid var(--line); padding: 14px 24px;
  display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap;
}
header.top h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
header.top .sub { color: var(--dim); font-size: 13px; }
main { max-width: 1180px; margin: 0 auto; padding: 24px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
     color: var(--dim); margin: 28px 0 10px; font-weight: 600; }
h2:first-child { margin-top: 0; }
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 16px; margin-bottom: 16px;
}
.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.shot { border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
        background: var(--bg); cursor: pointer; display: block; position: relative; }
.shot img { width: 100%; height: 150px; object-fit: cover; object-position: top;
            display: block; filter: saturate(.85); }
.shot .cap { padding: 7px 8px; font-size: 12px; border-top: 1px solid var(--line); }
.shot .cap b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
.shot .cap span { color: var(--dim); }
.shot input { position: absolute; top: 8px; left: 8px; width: 18px; height: 18px;
              accent-color: var(--accent); }
.shot.on { outline: 2px solid var(--accent); outline-offset: -2px; }
label.field { display: block; margin-bottom: 12px; font-size: 13px; color: var(--dim); }
label.field input[type=text], label.field input[type=number], label.field select {
  display: block; width: 100%; margin-top: 4px; padding: 7px 9px;
  background: var(--bg); color: var(--ink); border: 1px solid var(--line);
  border-radius: 5px; font-size: 14px;
}
label.check { display: flex; gap: 8px; align-items: center; font-size: 14px;
              margin-bottom: 10px; }
label.check input { accent-color: var(--accent); }
button {
  background: var(--accent); color: #16120c; border: 0; border-radius: 6px;
  padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
}
button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button:disabled { opacity: .45; cursor: not-allowed; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; color: var(--dim); font-weight: 600; padding: 6px 10px 6px 0;
     border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.dim { color: var(--dim); }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
       border: 1px solid var(--line); color: var(--dim); }
.tag.on { border-color: var(--accent); color: var(--accent); }
.tag.warn { border-color: var(--warn); color: var(--warn); }
.modes { display: grid; gap: 10px; }
.mode { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
        background: var(--bg); }
.mode-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mode-head b { font-weight: 600; }
.stage-badge { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px;
               border: 1px solid var(--line); color: var(--accent); letter-spacing: .04em; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
      padding: 12px; overflow-x: auto; font-size: 12px; margin: 0; }
.log { max-height: 320px; overflow-y: auto; }
.log div { padding: 2px 0; font-size: 13px; font-family: ui-monospace, Menlo, monospace; }
.log .stage { color: var(--accent); display: inline-block; min-width: 96px; }
.notice { border-left: 3px solid var(--warn); padding: 8px 12px; background: var(--panel);
          margin-bottom: 12px; font-size: 14px; }
.notice.bad { border-left-color: var(--bad); }
.chat { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
.msg { max-width: 78%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap;
       font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.msg .who { font-size: 11px; color: var(--dim); margin-bottom: 3px; }
.msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line);
           border-bottom-left-radius: 4px; }
.msg.user { align-self: flex-end; background: var(--accent); color: #16120c;
            border-bottom-right-radius: 4px; }
.msg.user .who { color: #4d3c1c; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: 13px; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; }
</style>
</head>
<body>
<header class="top">
  <h1><a href="/" style="text-decoration:none;color:inherit">bbq-shipment-agent</a></h1>
  <span class="sub">plan a run — no money is spent, no label is bought</span>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
